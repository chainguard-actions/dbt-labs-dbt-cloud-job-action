name: Test custom dbt_cloud_url with unreachable host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with unreachable custom URL
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: "https://this-host-does-not-exist.invalid"
          dbt_cloud_token: "test-token"
          dbt_cloud_account_id: "12345"
          dbt_cloud_job_id: "67890"
          failure_on_error: "true"
          cause: "Test run with unreachable URL"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          api_timeout: "3000"
      - name: Assert action failed due to unreachable host
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable host, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when host is unreachable"
