name: Test action with override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "fake-token-for-testing"
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "99999"
          failure_on_error: "false"
          cause: "Test run with overrides"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          schema_override: "test_schema"
          threads_override: "4"
          target_name_override: "test"
          generate_docs_override: "false"
          timeout_seconds_override: "300"
          steps_override: |
            - dbt run --select my_model
      - name: Assert action ran with overrides
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With fake credentials the action will fail at API call stage,
          # but it should not crash before processing inputs
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced an outcome with override inputs"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
