name: Test optional override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with optional overrides (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "fake-token-for-testing"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "true"
          cause: "Test run with overrides"
          wait_for_job: "false"
          schema_override: "test_schema"
          threads_override: "4"
          target_name_override: "test_target"
          generate_docs_override: "false"
          timeout_seconds_override: "300"
          get_artifacts: "false"
          fetch_catalog: "false"

      - name: Assert action failed (not crashed unexpectedly)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected (invalid credentials), optional inputs were accepted"
