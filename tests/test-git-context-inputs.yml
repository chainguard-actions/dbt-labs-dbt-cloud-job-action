name: Test git context inputs (git_sha, git_branch, github_pull_request_id)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: https://cloud.getdbt.com
          dbt_cloud_token: fake-token-for-testing
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "99999"
          failure_on_error: "false"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          cause: "Test git context inputs"
          git_sha: "abc1234def5678901234567890123456789abcde"
          git_branch: "feature/test-branch"
          github_pull_request_id: "42"
          interval: "5"
          api_timeout: "3000"
      - name: Assert action ran (failed gracefully with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
