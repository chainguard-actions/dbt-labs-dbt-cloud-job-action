name: Test action with custom URL and git inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: "https://emea.dbt.com"
          dbt_cloud_token: "fake-token-for-testing"
          dbt_cloud_account_id: "12345"
          dbt_cloud_job_id: "67890"
          failure_on_error: "true"
          cause: "Test run with custom URL and git branch"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          git_branch: "main"
          git_sha: "abc123def456"
          github_pull_request_id: "42"
      - name: Assert action ran with custom URL and git inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With fake credentials the action will fail at API call stage,
          # but it should not crash before processing inputs
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced an outcome with custom URL and git inputs"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
