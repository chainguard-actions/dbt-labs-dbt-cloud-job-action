name: Test custom dbt cloud URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom URL (expect failure due to invalid endpoint)
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: "https://invalid-dbt-cloud-url.example.com"
          dbt_cloud_token: "invalid-token-for-testing"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "true"
          cause: "Test run from GitHub Actions"
          wait_for_job: "false"

      - name: Assert action failed (not succeeded with invalid URL)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: action should have failed with invalid URL"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid URL"
