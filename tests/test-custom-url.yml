name: Test custom dbt Cloud URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with custom dbt Cloud URL
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: "https://emea.dbt.com"
          dbt_cloud_token: "invalid-token"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "true"
          cause: "Test run from GitHub Actions"
          wait_for_job: "false"
      - name: Assert action failed (not a URL parsing error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using custom URL with invalid credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with custom URL and invalid credentials"
