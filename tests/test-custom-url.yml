name: Test custom dbt Cloud URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom (invalid) dbt Cloud URL
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: https://invalid.example.com
          dbt_cloud_token: test-token
          dbt_cloud_account_id: "12345"
          dbt_cloud_job_id: "67890"
          cause: "Test custom URL"
          failure_on_error: "false"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"

      - name: Assert action failed due to unreachable custom URL
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable URL, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when dbt Cloud URL is unreachable"
