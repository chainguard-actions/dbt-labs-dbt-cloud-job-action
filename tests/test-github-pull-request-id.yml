name: Test github_pull_request_id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: fake-token-for-testing
          dbt_cloud_account_id: "12345"
          dbt_cloud_job_id: "67890"
          failure_on_error: "false"
          github_pull_request_id: "42"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
      - name: Assert action ran with github_pull_request_id input (fails gracefully on invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUN_ID: ${{ steps.action.outputs.run_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "run_id: $RUN_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RUN_ID" ]; then
              echo "FAIL: action succeeded but run_id output is empty"
              exit 1
            fi
            echo "PASS: got run_id '$RUN_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid credentials expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
