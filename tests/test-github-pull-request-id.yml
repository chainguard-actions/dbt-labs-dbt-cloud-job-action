name: Test github_pull_request_id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: https://cloud.getdbt.com
          dbt_cloud_token: fake-token-for-testing
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "99999"
          failure_on_error: "false"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          cause: "Test github_pull_request_id input"
          github_pull_request_id: "42"
      - name: Assert action ran with github_pull_request_id input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail due to invalid credentials,
          # but it must have accepted the github_pull_request_id input.
          # If outcome is 'success' or 'failure' (not 'skipped'), the input was accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted github_pull_request_id input (outcome: ${{ steps.action.outcome }})"
