name: Test github_pull_request_id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with github_pull_request_id input
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "invalid-token"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "true"
          cause: "Test github_pull_request_id input"
          wait_for_job: "false"
          github_pull_request_id: "42"
      - name: Assert action failed due to invalid credentials not input parsing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials when using github_pull_request_id input, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted github_pull_request_id input and failed at API call"
