name: Test dbt Cloud Job action with wait_for_job false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: https://cloud.getdbt.com
          dbt_cloud_token: invalid-token
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "99999"
          cause: "Test run from GitHub Actions - no wait"
          failure_on_error: "true"
          get_artifacts: "false"
          fetch_catalog: "false"
          wait_for_job: "false"
      - name: Assert action failed due to invalid credentials (no-wait path)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid credentials in no-wait mode"
