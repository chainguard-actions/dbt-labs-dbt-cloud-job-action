name: Test no-wait mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with wait_for_job disabled
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "invalid-token"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "false"
          cause: "Test no-wait mode"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
      - name: Assert action failed due to API error not input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials in no-wait mode, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed in no-wait mode with invalid credentials"
