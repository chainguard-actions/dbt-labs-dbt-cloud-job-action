name: Test failure_on_error false behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with failure_on_error false and invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "invalid-token-for-testing"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "false"
          cause: "Test run with failure_on_error false"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          api_timeout: "3000"
      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With invalid credentials the action will still fail at the API call level
          # regardless of failure_on_error setting (network/auth errors are not dbt job errors)
          # We just verify the action ran and produced a definitive outcome
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action produced outcome=$OUTCOME (expected failure or success)"
