name: Test failure_on_error set to false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with failure_on_error false (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "fake-token-for-testing"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "false"
          cause: "Test run with failure_on_error false"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"

      - name: Assert action completed (either success or failure is acceptable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action completed with outcome '$OUTCOME' (failure_on_error=false input accepted)"
