name: Test failure_on_error false with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "fake-token-for-testing"
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "99999"
          failure_on_error: "false"
          cause: "Test run from GitHub Actions"
          wait_for_job: "true"
          get_artifacts: "false"
          fetch_catalog: "false"

      - name: Assert action ran (outcome is failure or success due to API error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With invalid credentials the action will fail at the API call level
          # regardless of failure_on_error setting. We just verify it ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
