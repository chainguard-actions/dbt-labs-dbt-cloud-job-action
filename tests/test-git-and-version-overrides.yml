name: Test git and version override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with git and version override inputs (expect failure at API level)
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "invalid-token-for-testing"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "true"
          cause: "Test run with git and version overrides"
          wait_for_job: "false"
          git_sha: "abc1234def5678901234567890123456789012ab"
          git_branch: "feature/test-branch"
          dbt_version_override: "1.5.0"
          github_pull_request_id: "42"

      - name: Assert action ran (not skipped)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with git and version overrides (outcome=${{ steps.action.outcome }})"
