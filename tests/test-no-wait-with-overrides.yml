name: Test no-wait mode with optional overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "fake-token-for-testing"
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "99999"
          failure_on_error: "true"
          cause: "Test run from GitHub Actions - no wait"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          schema_override: "test_schema"
          target_name_override: "test_target"
          threads_override: "4"
          timeout_seconds_override: "3600"
          generate_docs_override: "false"

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials even in no-wait mode"
