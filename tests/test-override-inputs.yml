name: Test optional override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with optional override inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_token: "invalid-token"
          dbt_cloud_account_id: "99999999"
          dbt_cloud_job_id: "99999999"
          failure_on_error: "true"
          cause: "Test override inputs"
          wait_for_job: "false"
          git_branch: "main"
          schema_override: "test_schema"
          target_name_override: "test_target"
          threads_override: "4"
          timeout_seconds_override: "3600"
          generate_docs_override: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          steps_override: |
            - "dbt run --select my_model"
            - "dbt test --select my_model"
      - name: Assert action failed due to API error not input parsing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials when using override inputs, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted override inputs and failed at API call"
