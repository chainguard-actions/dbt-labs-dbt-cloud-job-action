name: Test custom URL and override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: "https://emea.dbt.com"
          dbt_cloud_token: "fake-dbt-token"
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "11111"
          failure_on_error: "true"
          cause: "Test custom URL and overrides"
          interval: "5"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"
          schema_override: "test_schema"
          git_branch: "main"
          target_name_override: "dev"
          threads_override: "4"
          timeout_seconds_override: "300"
          generate_docs_override: "false"
          steps_override: |
            - "dbt run --select my_model"
      - name: Assert action ran with custom URL and overrides
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUN_ID: ${{ steps.action.outputs.run_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "run_id: $RUN_ID"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials and custom URL"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$RUN_ID" ]; then
              echo "FAIL: action succeeded but run_id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with run_id=$RUN_ID"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
