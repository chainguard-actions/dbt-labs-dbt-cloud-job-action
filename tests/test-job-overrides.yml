name: Test dbt Cloud Job action with job execution overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: https://cloud.getdbt.com
          dbt_cloud_token: invalid-token
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "99999"
          cause: "Test run from GitHub Actions - job overrides"
          failure_on_error: "true"
          get_artifacts: "false"
          fetch_catalog: "false"
          wait_for_job: "false"
          dbt_version_override: "1.5.0"
          generate_docs_override: "false"
          threads_override: "4"
          timeout_seconds_override: "3600"
          steps_override: |
            - "dbt run --select my_model"
            - "dbt test --select my_model"
      - name: Assert action failed due to invalid credentials (job overrides path)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when job execution overrides are set"
