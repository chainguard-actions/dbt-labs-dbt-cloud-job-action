name: Test invalid credentials handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          dbt_cloud_url: https://cloud.getdbt.com
          dbt_cloud_token: invalid-token-for-testing
          dbt_cloud_account_id: "99999"
          dbt_cloud_job_id: "99999"
          cause: "Test run from GitHub Actions"
          failure_on_error: "false"
          wait_for_job: "false"
          get_artifacts: "false"
          fetch_catalog: "false"

      - name: Assert action failed due to invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
